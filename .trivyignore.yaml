# The only place a trivy finding may be accepted.
#
# Not a flag in the workflow and not a comment in the Terraform: an exception
# that lives here is a diff someone reviewed, and it expires. Four things are
# required for every entry, and an entry missing any of them should be rejected
# in review:
#
#   id         the check, e.g. AVD-GCP-0066
#   paths      the narrowest path that silences it — one file, never a folder,
#              because a folder-wide ignore also hides the next finding.
#              Relative to the folder being scanned, not to the repository: the
#              scan runs `trivy config terraform/`, so the path starts at
#              `modules/…`, never at `terraform/modules/…`. A wrong prefix is
#              accepted without complaint and simply never matches, so check
#              that the finding count actually drops after adding an entry.
#   statement  why this is acceptable here, in a sentence someone else can
#              judge. "False positive" alone is not a reason; say what makes it
#              one.
#   expires_at the date it stops applying. Past it, trivy fails again and the
#              question gets asked a second time, which is the point — an
#              exception with no end date is a decision nobody revisits.
#
# Shape, for when the first one is needed:
#
# misconfigurations:
#   - id: AVD-GCP-0066
#     paths:
#       - "terraform/modules/gcp/api-vm/network.tf"
#     statement: >-
#       The subnet has no flow logs. Nothing routes to it from outside and the
#       only traffic is the tunnel connector reaching loopback, so the logs
#       would record one constant flow at a cost the project cannot carry on
#       the free tier. Revisit if anything else joins the subnet.
#     expires_at: 2026-01-31
#     owner: fahlula
#
misconfigurations:
  - id: AVD-GCP-0031
    paths:
      - "modules/gcp/api-vm/main.tf"
    statement: >-
      The API instance has an ephemeral public IP, used for egress only:
      pulling its image from Artifact Registry and dialling out to the
      Cloudflare edge. Nothing inbound can reach it — the firewall in
      network.tf denies all ingress except Google's IAP forwarding range,
      and the only identity holding a tunnel grant is the deploy spoke.
      The alternative is Cloud NAT, which is the one line item on this
      stack the free tier does not cover. Revisit if the project gains a
      budget, or if anything inbound is ever opened on this instance.
    expires_at: 2026-04-30
    owner: fahlula
