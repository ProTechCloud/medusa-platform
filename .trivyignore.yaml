# The only place a trivy finding may be accepted.
#
# Not a flag in the workflow and not a comment in the Terraform: an exception
# that lives here is a diff someone reviewed, and it expires. Four things are
# required for every entry, and an entry missing any of them should be rejected
# in review:
#
#   id         the check, e.g. AVD-GCP-0066
#   paths      the narrowest path that silences it — one file, never a folder,
#              because a folder-wide ignore also hides the next finding.
#              Relative to the folder being scanned, not to the repository: the
#              scan runs `trivy config terraform/`, so the path starts at
#              `modules/…`, never at `terraform/modules/…`. A wrong prefix is
#              accepted without complaint and simply never matches, so check
#              that the finding count actually drops after adding an entry.
#   statement  why this is acceptable here, in a sentence someone else can
#              judge. "False positive" alone is not a reason; say what makes it
#              one.
#   expired_at the date it stops applying. Past it, trivy fails again and the
#              question gets asked a second time, which is the point — an
#              exception with no end date is a decision nobody revisits.
#
# Shape, for when the first one is needed:
#
# misconfigurations:
#   - id: AVD-GCP-0066
#     paths:
#       - "modules/gcp/<module>/<file>.tf"
#     statement: >-
#       <What the check flags, what makes it acceptable here, and what would
#       make it stop being acceptable.>
#     expired_at: 2026-01-31
#     owner: fahlula
#
