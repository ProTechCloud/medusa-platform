# Every stack's plan, in one run, reported as one comment.
#
# One caller rather than five, because the comment has to be one comment: a
# job can only write the section it produced, and five jobs editing a shared
# comment in parallel overwrite each other. Collecting the plans as artifacts
# and rendering them once, after all five finish, is what makes a single
# comment possible at all.
#
# No path filter on the trigger. GitHub treats a required check that never ran
# as passed, so filtering here would turn "nothing to plan" into "protection
# satisfied". Each plan job decides for itself whether there is work.
#
# Pull requests only. On a push to dev the CD workflows plan and apply that
# same commit, so a plan here would add nothing; it only ran beside them and
# held their state lock at the moment the apply needed it.
name: live-plan

on:
  pull_request:
    branches: [dev]

permissions: {}

jobs:
  # Queued per environment and pull request, never cancelled: an interrupted
  # plan leaves the state lock held and stalls the next run. The group is on
  # each job, not on the workflow, so stg's queue does not hold up prd's.
  gcp-stg:
    name: Plan stg
    uses: ./.github/workflows/_gcp-live-plan.yml
    concurrency:
      group: plan-gcp-stg-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      plan_store_bucket: ${{ vars.PLAN_STORE_BUCKET }}
      plan_store_prefix: stg/gcp/
      environment: stg
      root: terraform/live/stg/gcp
      project_id: ${{ vars.GCP_PROJECT_STG }}
      state_bucket: ${{ vars.STATE_BUCKET_STG }}
      management_state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
      spoke_service_account: ${{ vars.GCP_PLAN_SPOKE_STG }}
      service_account: ${{ vars.GCP_PLAN_HUB_STG }}
      workload_identity_provider: ${{ vars.GCP_PLAN_PROVIDER }}
      audience: ${{ vars.GCP_WIF_AUDIENCE }}
    permissions:
      contents: read
      id-token: write

  gcp-prd:
    name: Plan prd
    uses: ./.github/workflows/_gcp-live-plan.yml
    concurrency:
      group: plan-gcp-prd-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      plan_store_bucket: ${{ vars.PLAN_STORE_BUCKET }}
      plan_store_prefix: prd/gcp/
      environment: prd
      root: terraform/live/prd/gcp
      project_id: ${{ vars.GCP_PROJECT_PRD }}
      state_bucket: ${{ vars.STATE_BUCKET_PRD }}
      management_state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
      spoke_service_account: ${{ vars.GCP_PLAN_SPOKE_PRD }}
      service_account: ${{ vars.GCP_PLAN_HUB_PRD }}
      workload_identity_provider: ${{ vars.GCP_PLAN_PROVIDER }}
      audience: ${{ vars.GCP_WIF_AUDIENCE }}
    permissions:
      contents: read
      id-token: write

  cloudflare-org:
    name: Plan org cloudflare
    uses: ./.github/workflows/_cloudflare-live-plan.yml
    concurrency:
      group: plan-cloudflare-org-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      plan_store_bucket: ${{ vars.PLAN_STORE_BUCKET }}
      plan_store_prefix: org/cloudflare/live/
      stack: org
      root: terraform/live/org/cloudflare
      state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
      workload_identity_provider: ${{ vars.GCP_PLAN_PROVIDER }}
      audience: ${{ vars.GCP_WIF_AUDIENCE }}
    secrets:
      CLOUDFLARE_PLAN_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_TOKEN }}
    permissions:
      contents: read
      id-token: write

  cloudflare-stg:
    name: Plan stg cloudflare
    uses: ./.github/workflows/_cloudflare-live-plan.yml
    concurrency:
      group: plan-cloudflare-stg-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      plan_store_bucket: ${{ vars.PLAN_STORE_BUCKET }}
      plan_store_prefix: stg/cloudflare/
      stack: stg
      root: terraform/live/stg/cloudflare
      state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
      workload_identity_provider: ${{ vars.GCP_PLAN_PROVIDER }}
      audience: ${{ vars.GCP_WIF_AUDIENCE }}
    secrets:
      CLOUDFLARE_PLAN_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_TOKEN }}
    permissions:
      contents: read
      id-token: write

  cloudflare-prd:
    name: Plan prd cloudflare
    uses: ./.github/workflows/_cloudflare-live-plan.yml
    concurrency:
      group: plan-cloudflare-prd-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      plan_store_bucket: ${{ vars.PLAN_STORE_BUCKET }}
      plan_store_prefix: prd/cloudflare/
      stack: prd
      root: terraform/live/prd/cloudflare
      state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
      workload_identity_provider: ${{ vars.GCP_PLAN_PROVIDER }}
      audience: ${{ vars.GCP_WIF_AUDIENCE }}
    secrets:
      CLOUDFLARE_PLAN_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_TOKEN }}
    permissions:
      contents: read
      id-token: write

  posthog-org:
    name: Plan org posthog
    uses: ./.github/workflows/_posthog-live-plan.yml
    concurrency:
      group: plan-posthog-org-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      plan_store_bucket: ${{ vars.PLAN_STORE_BUCKET }}
      plan_store_prefix: org/posthog/live/
      stack: org
      root: terraform/live/org/posthog
      state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
      workload_identity_provider: ${{ vars.GCP_PLAN_PROVIDER }}
      audience: ${{ vars.GCP_WIF_AUDIENCE }}
    secrets:
      POSTHOG_PLAN_API_KEY: ${{ secrets.POSTHOG_PLAN_API_KEY }}
    permissions:
      contents: read
      id-token: write

  setup-org:
    name: Plan org setup
    uses: ./.github/workflows/_setup-plan.yml
    concurrency:
      group: plan-setup-org-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      stack: org
      root: terraform/live/org/gcp/_setup
    permissions:
      contents: read
      id-token: write

  setup-stg:
    name: Plan stg setup
    uses: ./.github/workflows/_setup-plan.yml
    concurrency:
      group: plan-setup-stg-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      stack: stg
      root: terraform/live/stg/gcp/_setup
      project_id: ${{ vars.GCP_PROJECT_STG }}
    permissions:
      contents: read
      id-token: write

  setup-prd:
    name: Plan prd setup
    uses: ./.github/workflows/_setup-plan.yml
    concurrency:
      group: plan-setup-prd-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      stack: prd
      root: terraform/live/prd/gcp/_setup
      project_id: ${{ vars.GCP_PROJECT_PRD }}
    permissions:
      contents: read
      id-token: write

  # The only job that may write to the pull request. It runs even when a plan
  # failed, so a red stack is named in the comment instead of silently absent.
  plan-comment:
    name: Plan comment
    needs: [gcp-stg, gcp-prd, cloudflare-org, cloudflare-stg, cloudflare-prd, posthog-org, setup-org, setup-stg, setup-prd]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # A stack that was not touched uploaded nothing, so a missing artifact
      # is the signal that there is nothing to report for it.
      #
      # No continue-on-error. At this pin a pattern that matches nothing
      # succeeds with "Total of 0 artifact(s)", so a docs-only pull request
      # already passes. What continue-on-error would add is hiding a real
      # download failure — and then the script sees no plans, reads that as
      # "nothing in scope", and deletes the comment while the job goes green.
      - name: Collect the plans
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: plan-*
          path: plans

      - name: One comment for every stack
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const run = require('./.github/scripts/pull-request/plan-comment.js')
            await run({ github, context, core })
