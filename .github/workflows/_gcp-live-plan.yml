# Shared by every GCP plan caller. The hub a caller may request is pinned to
# this file's path in the identity pool, so a workflow added in a pull request
# cannot reach a plan identity by copying these steps.
name: _gcp-live-plan

on:
  workflow_call:
    inputs:
      environment:
        description: Environment being planned, used in the comment heading.
        required: true
        type: string
      root:
        description: Path of the root to plan, e.g. terraform/live/stg/gcp.
        required: true
        type: string
      project_id:
        required: true
        type: string
      state_bucket:
        required: true
        type: string
      management_state_bucket:
        required: true
        type: string
      spoke_service_account:
        description: Spoke the hub becomes. The hub itself holds no permissions.
        required: true
        type: string
      service_account:
        description: Plan hub to impersonate. Read-only, and denied secret values.
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      audience:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TERRAFORM_VERSION: 1.16.6
  PLAN_MARKER: "<!-- medusa-plan:${{ inputs.environment }}/gcp -->"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # The default token stays in .git/config and is readable by every
          # later step, including anything a dependency runs.
          persist-credentials: false

      # A plan that is skipped reports as passed to branch protection, so the
      # job always runs and decides for itself whether there is work. When
      # there is none it removes its stale comment and succeeds.
      - name: Does this PR touch the stack?
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          if echo "$changed" | grep -qE "^(${{ inputs.root }}/|terraform/modules/)"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no change under ${{ inputs.root }}/ or terraform/modules/"
          fi

      - name: Remove stale plan comment
        if: steps.scope.outputs.relevant == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MARKER: ${{ env.PLAN_MARKER }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            for (const c of comments.filter(c => c.body.includes(process.env.MARKER))) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id,
              })
            }

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.scope.outputs.relevant == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.scope.outputs.relevant == 'true'
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
          audience: ${{ inputs.audience }}

      # -lockfile=readonly: init fails rather than silently adding a provider
      # hash, so a dependency cannot change under a reviewed plan.
      - name: Init
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="impersonate_service_account=${{ inputs.spoke_service_account }}"

      - name: Plan
        id: plan
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          TF_VAR_project_id: ${{ inputs.project_id }}
          TF_VAR_management_state_bucket: ${{ inputs.management_state_bucket }}
          TF_VAR_spoke_service_account: ${{ inputs.spoke_service_account }}
        run: |
          # pipefail is load-bearing: without it the step reports tee's exit
          # status, and a plan that errored shows as a green check.
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan 2>&1 | tee plan.txt

      # One comment per stack, updated in place. A new comment per push buries
      # the review conversation under plan output within a few iterations.
      - name: Comment the plan
        if: steps.scope.outputs.relevant == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MARKER: ${{ env.PLAN_MARKER }}
          ROOT: ${{ inputs.root }}
          STACK: ${{ inputs.environment }}
        with:
          script: |
            const fs = require('fs')
            const marker = process.env.MARKER
            const limit = 60000

            let plan = fs.readFileSync(`${process.env.ROOT}/plan.txt`, 'utf8')
            let notice = ''
            if (plan.length > limit) {
              notice = `\n> Output cut at ${limit} characters. Read the full plan in the job log.`
              plan = plan.slice(0, limit)
            }

            const m = plan.match(/Plan: (\d+) to add, (\d+) to change, (\d+) to destroy/)
            const summary = m
              ? `**${m[1]}** to add · **${m[2]}** to change · **${m[3]}** to destroy`
              : (/No changes/.test(plan) ? '**No changes.**' : '_Counts unavailable — see the log._')

            const body = [
              marker,
              `### Plan ${process.env.STACK} (gcp)`,
              '',
              summary,
              notice,
              '',
              // open: the diff is the thing a reviewer came to read. Collapsed by
            // default, approving without expanding it is one click, and the
            // plan comment stops being a gate and becomes decoration.
            '<details open><summary>Full plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existing = comments.find(c => c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo, body,
              })
            }
