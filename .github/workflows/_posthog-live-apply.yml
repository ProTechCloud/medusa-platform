name: _posthog-live-apply

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      gh_environment:
        description: GitHub environment the job runs in. The state binding for this stack trusts this exact name.
        required: true
        type: string
      root:
        required: true
        type: string
      state_bucket:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      audience:
        required: true
        type: string
    secrets:
      # An environment secret on posthog-org. A job that declares an
      # environment reads that environment's value, so the caller has nothing
      # to pass; the declaration only names it.
      POSTHOG_APPLY_API_KEY:
        required: true

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: 1.16.6

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.gh_environment }}
      deployment: false

    concurrency:
      group: apply-posthog-${{ inputs.stack }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # No minting: PostHog has no API to issue a key per run. The apply key
      # lives only in the posthog-org environment, so pull-request code never
      # reaches it.
      - name: Use the PostHog apply key
        shell: bash
        env:
          APPLY_KEY: ${{ secrets.POSTHOG_APPLY_API_KEY }}
        run: |
          echo "::add-mask::$APPLY_KEY"
          echo "POSTHOG_API_KEY=$APPLY_KEY" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # No service account: the federated GitHub identity reads this stack's
      # state prefix directly (state_access.tf in org/gcp/_setup).
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          audience: ${{ inputs.audience }}

      - name: Init
        working-directory: ${{ inputs.root }}
        run: terraform init -lockfile=readonly -backend-config="bucket=${{ inputs.state_bucket }}"

      # No separate plan step: apply plans against the current state on its
      # own. See _gcp-live-apply.yml.
      - name: Apply
        working-directory: ${{ inputs.root }}
        env:
          TF_VAR_organization_id: ${{ vars.POSTHOG_ORGANIZATION_ID }}
          TF_VAR_administrator_email: ${{ vars.POSTHOG_ADMINISTRATOR_EMAIL }}
        run: terraform apply -auto-approve -input=false -lock-timeout=5m -no-color

      # The project token SDKs send with, into stg's secret, where the VM reads
      # it before every start of the app. Same identity as the state access
      # above: the stg secret grants this apply entry secretVersionAdder and
      # nothing else (stg/gcp/main.tf), so no service account is impersonated.
      #
      # stg-cd creates the secret and that grant on the same push that runs
      # this, in a workflow of its own, so on the first merge they may not
      # exist yet. This identity cannot read the secret to check, so it tries
      # the write itself, every 20 seconds for up to ten minutes, rather than
      # leaving a run to repeat by hand.
      - name: Write the project token to stg's secret
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          PROJECT: ${{ vars.GCP_PROJECT_STG }}
          SECRET: medusa_stg_posthog_posthog-project-token
        run: |
          set -euo pipefail
          value=$(terraform output -raw project_api_token)

          # An empty output would become the latest version, and the VM reads
          # versions/latest.
          if [ -z "$value" ]; then
            echo "::error::terraform output project_api_token is empty. The secret was left untouched."
            exit 1
          fi
          echo "::add-mask::$value"

          deadline=$((SECONDS + 600))
          # Through stdin, never an argument: arguments show up in process
          # listings and in gcloud's own command log.
          until printf '%s' "$value" | gcloud secrets versions add "$SECRET" \
            --project="$PROJECT" \
            --data-file=-; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$SECRET could not be written for ten minutes. Check that stg-cd created it and its grant."
              exit 1
            fi
            echo "Waiting for $SECRET and its grant from stg-cd…"
            sleep 20
          done
