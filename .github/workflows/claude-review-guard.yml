name: Claude Review Guard

# The review's own files change only by a direct push to the base branch, never
# through a pull request. pull_request_target runs this file as it is on the
# base branch, so a pull request cannot edit the guard away. It checks out no
# code from the pull request: it only reads the pull request's list of files.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Review — Protected files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse changes to the review's own files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          protected='^\.github/claude-review/|^\.github/workflows/claude-(code-review|review-guard)\.yml$'
          hit=$(grep -E "$protected" <<<"$files" || true)
          if [ -n "$hit" ]; then
            echo "::error::this pull request changes the review's own files, which change only by a direct push to the base branch"
            sed 's/^/  /' <<<"$hit"
            exit 1
          fi
          echo "no protected file changed"
