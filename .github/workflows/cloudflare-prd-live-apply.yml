name: cloudflare-prd-live-apply

# Same switch as gcp-prd-live-apply.yml: visible wiring, apply behind the
# repository variable TF_APPLY_ENABLE_PRD.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: apply prd cloudflare
    if: vars.TF_APPLY_ENABLE_PRD == 'true'
    uses: ./.github/workflows/_cloudflare-live-apply.yml
    with:
      stack: prd
      gh_environment: prd
      root: terraform/live/prd/cloudflare
      state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
      workload_identity_provider: ${{ vars.GCP_APPLY_PROVIDER }}
      audience: ${{ vars.GCP_WIF_AUDIENCE }}
    secrets:
      CLOUDFLARE_MINT_TOKEN: ${{ secrets.CLOUDFLARE_MINT_TOKEN }}
    permissions:
      contents: read
      id-token: write
