name: Claude Code Review

# The review itself lives in frubble-platform/claude-review, the one place it is kept and
# changed. This file only says when to run it, and passes this repository's token.
on:
  pull_request:
    # edited: the review judges the description too, so a new title or body is reviewed
    # again; an edit to anything else is skipped by the review itself.
    types: [opened, synchronize, ready_for_review, reopened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write

jobs:
  review:
    name: Claude
    if: vars.CLAUDE_REVIEW_ENABLED == 'true'
    uses: frubble-platform/claude-review/.github/workflows/review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
