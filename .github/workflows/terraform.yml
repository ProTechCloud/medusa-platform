name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: terraform

env:
  TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}

jobs:
  validate:
    name: fmt · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TF_SA_KEY }}

      - name: Init
        run: terraform init

      - name: Plan
        id: plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8')
            const body = [
              '### Terraform plan',
              '```terraform',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n…truncated' : plan,
              '```',
            ].join('\n')
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

  apply:
    name: apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TF_SA_KEY }}

      - name: Init
        run: terraform init

      - name: Apply
        run: terraform apply -auto-approve -lock-timeout=5m
