name: terraform

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required to mint the OIDC token WIF exchanges

defaults:
  run:
    working-directory: terraform

env:
  TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}

jobs:
  validate:
    name: fmt · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      # The github provider fails deep inside a data source when this is empty,
      # which reads as a Terraform bug rather than a missing bootstrap secret.
      - name: Preflight — required secrets present
        run: |
          missing=0
          for v in TF_GITHUB_TOKEN CLOUDFLARE_API_TOKEN GCP_WORKLOAD_IDENTITY_PROVIDER TF_STATE_BUCKET; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set in repository secrets"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "TF_GITHUB_TOKEN must be created by hand: GitHub has no API to mint a PAT."
            echo "See the README section 'Repository secrets this stack needs'."
            exit 1
          fi
          echo "all required secrets present"
        env:
          TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      # Keyless: the org enforces iam.disableServiceAccountKeyCreation, so
      # there is no JSON key. Only this repository may make the exchange.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Plan
        id: plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8')
            const body = [
              '### Terraform plan',
              '```terraform',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n…truncated' : plan,
              '```',
            ].join('\n')
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

  apply:
    name: apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      # Keyless: the org enforces iam.disableServiceAccountKeyCreation, so
      # there is no JSON key. Only this repository may make the exchange.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_SERVICE_ACCOUNT }}

      - name: Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Apply
        run: terraform apply -auto-approve -lock-timeout=5m
