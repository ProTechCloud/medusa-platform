# The bootstrap admin's one federated path: this file, in a named environment,
# on dev. It holds owner on the management project, so nothing runs before the
# check that the environment makes a reviewer approve the run.
name: _setup-apply

on:
  workflow_call:
    inputs:
      stack:
        description: org, stg or prd.
        required: true
        type: string
      gh_environment:
        description: GitHub environment the job runs in. The bootstrap admin trusts this exact name.
        required: true
        type: string
      root:
        required: true
        type: string
      project_id:
        description: The environment's project. Empty for org.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: 1.16.6

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read

    # No `deployment: false`, unlike the other applies: this job runs as owner on
    # the management project, and its only gate is the environment's reviewer.
    environment:
      name: ${{ inputs.gh_environment }}

    concurrency:
      group: apply-setup-${{ inputs.stack }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require a reviewer on the environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.gh_environment }}
        run: .github/scripts/terraform/require-environment-reviewer.sh

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_APPLY_PROVIDER }}
          service_account: ${{ vars.GCP_BOOTSTRAP_ADMIN }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}

      - name: Init
        working-directory: ${{ inputs.root }}
        env:
          BUCKET: ${{ vars.MANAGEMENT_STATE_BUCKET }}
        run: ${{ github.workspace }}/.github/scripts/terraform/init.sh

      # Each root declares only some of these. Terraform ignores the others.
      - name: Apply
        working-directory: ${{ inputs.root }}
        env:
          TF_VAR_org_id: ${{ vars.GCP_ORG_ID }}
          TF_VAR_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
          TF_VAR_management_project_id: ${{ vars.GCP_MANAGEMENT_PROJECT }}
          TF_VAR_environment_projects: '{"stg":"${{ vars.GCP_PROJECT_STG }}","prd":"${{ vars.GCP_PROJECT_PRD }}"}'
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_platform_repository: ${{ github.event.repository.name }}
          TF_VAR_backend_repository: ${{ vars.BACKEND_REPOSITORY }}
          TF_VAR_developer_group: ${{ vars.GCP_DEVELOPER_GROUP }}
          TF_VAR_administrator: ${{ vars.GCP_ADMINISTRATOR }}
          TF_VAR_project_id: ${{ inputs.project_id }}
          TF_VAR_management_state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
          TF_VAR_environment: ${{ inputs.stack }}
        run: terraform apply -auto-approve -input=false -lock-timeout=5m -no-color
