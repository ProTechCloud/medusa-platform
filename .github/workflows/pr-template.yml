name: pr-template

# Holds a pull request to its template. `edited` is here because fixing the
# title or the body is a change this check has to see. No path filter: the
# check is required, so it has to report on every pull request.
on:
  pull_request:
    branches: [dev]
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-template:
    name: Quality — PR Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Use the base branch's validation rules. This workflow and its runtime
      # remain PR-controlled, so this check is not tamper-resistant.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Outside the repository, and with the config beside it, because
      # commitlint resolves the config's `extends` from where the config sits.
      - name: Lint the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/pull-request/lint-title.sh

      # Bots write neither the body nor the checklist.
      - name: Check the body against the template
        if: github.event.pull_request.user.type != 'Bot'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/pull-request/check-body.js
