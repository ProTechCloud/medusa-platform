name: pr-template

# Holds a pull request to its template. `edited` is here because fixing the
# title or the body is a change this check has to see. No path filter: the
# check is required, so it has to report on every pull request.
on:
  pull_request:
    branches: [dev]
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMMITLINT_VERSION: 21.2.4

jobs:
  pr-template:
    name: Quality — PR Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The rules come from the base branch, so a pull request cannot loosen
      # the template or the title rules it is held to.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Outside the repository, and with the config beside it, because
      # commitlint resolves the config's `extends` from where the config sits.
      - name: Lint the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          dir="$RUNNER_TEMP/commitlint"
          npm install --prefix "$dir" --ignore-scripts --no-audit --no-fund \
            "@commitlint/cli@$COMMITLINT_VERSION" \
            "@commitlint/config-conventional@$COMMITLINT_VERSION"
          if [ -f base/commitlint.config.mjs ]; then
            cp base/commitlint.config.mjs "$dir"
          else
            # First merge only: the base branch has no config yet.
            cp commitlint.config.mjs "$dir"
          fi
          cd "$dir"
          printf '%s\n' "$TITLE" | ./node_modules/.bin/commitlint --verbose

      # Bots write neither the body nor the checklist.
      - name: Check the body against the template
        if: github.event.pull_request.user.type != 'Bot'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          node <<'SCRIPT'
          const { readFileSync } = require("node:fs");

          // The comments are the template's prompts, so a section holding only
          // them is empty. Inside a code fence, a heading is not a section and
          // a checkbox is not an item; a fence closes only on its own character,
          // at its length or longer.
          function sections(text) {
            const found = new Map();
            let section;
            let fence;
            for (const line of text.replace(/<!--[\s\S]*?-->/g, "").split(/\r?\n/)) {
              const marker = line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
              const wasFenced = Boolean(fence);
              if (marker && !fence) {
                fence = marker[1];
              } else if (marker && marker[1][0] === fence[0] && marker[1].length >= fence.length && !marker[2].trim()) {
                fence = undefined;
              }
              const fenced = wasFenced || Boolean(fence);
              const heading = fenced ? null : line.match(/^##\s+(.+?)\s*$/);
              if (heading) {
                section = { text: "", items: [] };
                found.set(heading[1], section);
              } else if (section) {
                section.text += line;
                const item = fenced ? null : line.match(/^\s*[-*] \[( |x)\]\s*(.+?)\s*$/i);
                if (item) section.items.push({ ticked: item[1] !== " ", text: item[2] });
              }
            }
            return found;
          }

          const template = sections(readFileSync("base/.github/pull_request_template.md", "utf8"));
          const body = sections(process.env.BODY);
          const problems = [];

          for (const [name, prompt] of template) {
            const section = body.get(name);
            if (!section) {
              problems.push(`"${name}" is missing`);
            } else if (!section.text.trim()) {
              problems.push(`"${name}" is empty`);
            } else {
              for (const { text } of prompt.items) {
                if (!section.items.some((item) => item.text.includes(text))) {
                  problems.push(`"${name}" lost the item: ${text}`);
                }
              }
            }
          }

          for (const [name, section] of body) {
            for (const { ticked, text } of section.items) {
              if (!ticked && !/\bn\/a\b/i.test(text)) {
                problems.push(`"${name}" has an item neither ticked nor marked n/a: ${text}`);
              }
            }
          }

          for (const problem of problems) console.log(`::error::${problem}`);
          process.exit(problems.length ? 1 : 0);
          SCRIPT
