# Shared by every _setup plan. The setup plan identity is pinned to this file's
# path in the identity pool, so a workflow added in a pull request cannot reach
# it by copying these steps.
name: _setup-plan

on:
  workflow_call:
    inputs:
      stack:
        description: org, stg or prd. Also names the plan artifact.
        required: true
        type: string
      root:
        description: Path of the root to plan, e.g. terraform/live/stg/gcp/_setup.
        required: true
        type: string
      project_id:
        description: The environment's project. Empty for org.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: 1.16.6

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Does this PR touch the stack?
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATTERN: ^(${{ inputs.root }}/|terraform/modules/gcp/|\.github/workflows/_setup-plan\.yml$|\.github/scripts/terraform/)
        run: .github/scripts/pull-request/stack-touched.sh

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.scope.outputs.relevant == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.scope.outputs.relevant == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_PROVIDER }}
          service_account: ${{ vars.GCP_SETUP_PLAN }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}

      - name: Init
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        env:
          BUCKET: ${{ vars.MANAGEMENT_STATE_BUCKET }}
        run: "$GITHUB_WORKSPACE/.github/scripts/terraform/init.sh"

      # Each root declares only some of these. Terraform ignores the others.
      - name: Plan
        id: plan
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          TF_VAR_org_id: ${{ vars.GCP_ORG_ID }}
          TF_VAR_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
          TF_VAR_management_project_id: ${{ vars.GCP_MANAGEMENT_PROJECT }}
          TF_VAR_environment_projects: '{"stg":"${{ vars.GCP_PROJECT_STG }}","prd":"${{ vars.GCP_PROJECT_PRD }}"}'
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_platform_repository: ${{ github.event.repository.name }}
          TF_VAR_backend_repository: ${{ vars.BACKEND_REPOSITORY }}
          TF_VAR_developer_group: ${{ vars.GCP_DEVELOPER_GROUP }}
          TF_VAR_administrator: ${{ vars.GCP_ADMINISTRATOR }}
          TF_VAR_project_id: ${{ inputs.project_id }}
          TF_VAR_management_state_bucket: ${{ vars.MANAGEMENT_STATE_BUCKET }}
          TF_VAR_environment: ${{ inputs.stack }}
        run: "$GITHUB_WORKSPACE/.github/scripts/terraform/plan.sh"

      - name: Put the full plan in the plan store
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        env:
          BUCKET: ${{ vars.PLAN_STORE_BUCKET }}
          PREFIX: setup/
        run: "$GITHUB_WORKSPACE/.github/scripts/terraform/plan-store-upload.sh"

      - name: Upload the plan
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-setup-${{ inputs.stack }}
          path: |
            ${{ inputs.root }}/plan.txt
            ${{ inputs.root }}/plan-url.txt
          retention-days: 5
          if-no-files-found: error
