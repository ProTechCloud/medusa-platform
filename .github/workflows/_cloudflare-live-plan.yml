name: _cloudflare-live-plan

on:
  workflow_call:
    inputs:
      stack:
        description: org, stg or prd — used in the comment heading and the state prefix.
        required: true
        type: string
      root:
        required: true
        type: string
      state_bucket:
        description: Management bucket. Cloudflare state is not environment workload state.
        required: true
        type: string
      environment_state_bucket:
        description: Environment bucket this stack reads the app port from. Empty for org.
        required: false
        type: string
        default: ""
      service_account:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      audience:
        required: true
        type: string
    secrets:
      CLOUDFLARE_MINT_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TERRAFORM_VERSION: 1.16.6
  PLAN_MARKER: "<!-- medusa-plan:${{ inputs.stack }}/cloudflare -->"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Does this PR touch the stack?
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          if echo "$changed" | grep -qE "^(${{ inputs.root }}/|terraform/modules/cloudflare/)"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove stale plan comment
        if: steps.scope.outputs.relevant == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MARKER: ${{ env.PLAN_MARKER }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            })
            for (const c of comments.filter(c => c.body.includes(process.env.MARKER))) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id,
              })
            }

      # A token that lives as long as the job cannot be replayed from a leaked
      # log tomorrow. Read-only here, because a plan must never be able to
      # change the edge.
      - name: Mint a read-only Cloudflare token
        id: cf
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        env:
          MINT_TOKEN: ${{ secrets.CLOUDFLARE_MINT_TOKEN }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          groups=$(curl -sS -H "Authorization: Bearer $MINT_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/permission_groups")

          id_of() { echo "$groups" | jq -r --arg n "$1" '.result[] | select(.name==$n) | .id' | head -1; }

          body=$(jq -n \
            --arg name "medusa-plan-${{ inputs.stack }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            --arg acct "$ACCOUNT_ID" --arg zone "$ZONE_ID" \
            --arg tunnel_read "$(id_of 'Cloudflare Tunnel Read')" \
            --arg zone_read "$(id_of 'Zone Read')" \
            --arg dns_read "$(id_of 'DNS Read')" \
            --arg settings_read "$(id_of 'Zone Settings Read')" \
            '{name: $name,
              policies: [
                {effect: "allow",
                 resources: {("com.cloudflare.api.account." + $acct): "*"},
                 permission_groups: [{id: $tunnel_read}]},
                {effect: "allow",
                 resources: {("com.cloudflare.api.account.zone." + $zone): "*"},
                 permission_groups: [{id: $zone_read}, {id: $dns_read}, {id: $settings_read}]}
              ]}')

          created=$(curl -sS -X POST -H "Authorization: Bearer $MINT_TOKEN" \
            -H "Content-Type: application/json" -d "$body" \
            "https://api.cloudflare.com/client/v4/user/tokens")

          if [ "$(echo "$created" | jq -r '.success')" != "true" ]; then
            echo "::error::Could not mint a Cloudflare token"
            echo "$created" | jq -r '.errors'
            exit 1
          fi

          token=$(echo "$created" | jq -r '.result.value')
          # Masked before it is used anywhere, so even an accidental `set -x`
          # downstream prints asterisks.
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "token_id=$(echo "$created" | jq -r '.result.id')" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.scope.outputs.relevant == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: steps.scope.outputs.relevant == 'true'
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
          audience: ${{ inputs.audience }}

      - name: Init
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        run: terraform init -lockfile=readonly -backend-config="bucket=${{ inputs.state_bucket }}"

      - name: Plan
        id: plan
        if: steps.scope.outputs.relevant == 'true'
        working-directory: ${{ inputs.root }}
        shell: bash
        env:
          TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain: ${{ vars.CLOUDFLARE_DOMAIN }}
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan 2>&1 | tee plan.txt

      - name: Comment the plan
        if: steps.scope.outputs.relevant == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MARKER: ${{ env.PLAN_MARKER }}
          ROOT: ${{ inputs.root }}
          STACK: ${{ inputs.stack }}
        with:
          script: |
            const fs = require('fs')
            const marker = process.env.MARKER
            const limit = 60000
            let plan = fs.readFileSync(`${process.env.ROOT}/plan.txt`, 'utf8')
            let notice = ''
            if (plan.length > limit) {
              notice = `\n> Output cut at ${limit} characters. Read the full plan in the job log.`
              plan = plan.slice(0, limit)
            }
            const m = plan.match(/Plan: (\d+) to add, (\d+) to change, (\d+) to destroy/)
            const summary = m
              ? `**${m[1]}** to add · **${m[2]}** to change · **${m[3]}** to destroy`
              : (/No changes/.test(plan) ? '**No changes.**' : '_Counts unavailable — see the log._')
            const body = [marker, `### Plan ${process.env.STACK} (cloudflare)`, '', summary, notice, '',
              '<details><summary>Full plan</summary>', '', '```terraform', plan, '```', '', '</details>'].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            })
            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo, body })
            }

      # always(), because the token outliving a failed job is exactly the case
      # that matters: a run that died mid-plan is the one whose log gets read.
      - name: Revoke the token
        if: always() && steps.cf.outputs.token_id != ''
        shell: bash
        env:
          MINT_TOKEN: ${{ secrets.CLOUDFLARE_MINT_TOKEN }}
        run: |
          curl -sS -X DELETE -H "Authorization: Bearer $MINT_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/${{ steps.cf.outputs.token_id }}" \
            | jq -r '.success' | grep -q true && echo "token revoked"
