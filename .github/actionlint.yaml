# The prd apply workflows are deliberately switched off: they trigger on every
# push so their wiring stays visible and reviewed, and the job never runs. That
# is the standard's "planned but not applied", and `if: false` states it in the
# one place a reader looks.
#
# Scoped to these two files and this one message, so a genuine always-false
# condition anywhere else is still an error.
paths:
  .github/workflows/gcp-prd-live-apply.yml:
    ignore:
      - 'constant expression "false" in condition'
  .github/workflows/cloudflare-prd-live-apply.yml:
    ignore:
      - 'constant expression "false" in condition'
