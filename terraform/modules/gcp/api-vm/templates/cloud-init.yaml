#cloud-config
# Container-Optimized OS. Docker and cloud-init ship with the image; there is
# no package manager.
#
# COS mount semantics drive the layout here
# (https://cloud.google.com/container-optimized-os/docs/concepts/security):
#
#   /                      read-only,  executable
#   /var, /home, /tmp      writable,   NOT executable
#   /etc                   writable,   executable   (stateless)
#   /var/lib/{google,docker,toolbox}, /mnt/disks    writable, executable
#
# So: executable scripts live under /etc (cloud-init rewrites them on every
# boot, which is what makes a stateless /etc safe to rely on), while mutable
# data lives under /var/lib where noexec is irrelevant to a data file.

write_files:
  # Resolves the tunnel token from Secret Manager using the instance's own
  # identity. The token never appears in instance metadata, where any process
  # on the box could read it without needing IAM.
  - path: /etc/medusa/fetch-token.sh
    permissions: "0700"
    owner: root
    content: |
      #!/bin/bash
      # Parsed with python3 (present on COS — cloud-init itself runs on it)
      # rather than sed: the Google REST APIs pretty-print their JSON, so a
      # `"key":"value"` regex silently yields an empty string against the
      # `"key": "value"` they actually return.
      set -euo pipefail

      ACCESS_TOKEN=$(curl -sf -H "Metadata-Flavor: Google" \
        "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
        | /usr/bin/python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
      [ -n "$ACCESS_TOKEN" ] || { echo "no access token from metadata server" >&2; exit 1; }

      TOKEN=$(curl -sf -H "Authorization: Bearer $ACCESS_TOKEN" \
        "https://secretmanager.googleapis.com/v1/projects/${project_id}/secrets/${secret_id}/versions/latest:access" \
        | /usr/bin/python3 -c 'import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)["payload"]["data"]).decode(), end="")')
      [ -n "$TOKEN" ] || { echo "empty tunnel token from Secret Manager" >&2; exit 1; }

      printf '%s' "$TOKEN"

  # docker-credential-gcr writes to $HOME/.docker, and /root is read-only on
  # COS, so HOME is redirected to the writable data directory.
  - path: /etc/medusa/docker-login.sh
    permissions: "0700"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      export HOME=/var/lib/medusa
      mkdir -p "$HOME"
      /usr/bin/docker-credential-gcr configure-docker \
        --registries="${region}-docker.pkg.dev"

  # Keeps containers away from the metadata server, where any caller gets the
  # instance's access token, and through it the tunnel token in Secret
  # Manager. A container's traffic to it is forwarded, so it passes through
  # DOCKER-USER; the host's own calls (fetch-token.sh, docker-login.sh) go out
  # through OUTPUT and are untouched. DNS on port 53 stays open, because the
  # metadata server is also the resolver containers inherit from the host.
  #
  # The rules live in a chain of their own, flushed and rebuilt on every run,
  # so running this again after a partial failure cannot leave them out of
  # order. medusa-app.service runs it before every start, after docker has
  # created DOCKER-USER.
  - path: /etc/medusa/block-metadata.sh
    permissions: "0700"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      iptables -N MEDUSA-METADATA 2>/dev/null || true
      iptables -F MEDUSA-METADATA
      iptables -A MEDUSA-METADATA -p udp --dport 53 -j RETURN
      iptables -A MEDUSA-METADATA -p tcp --dport 53 -j RETURN
      iptables -A MEDUSA-METADATA -j REJECT
      iptables -C DOCKER-USER -d 169.254.169.254 -j MEDUSA-METADATA 2>/dev/null \
        || iptables -I DOCKER-USER -d 169.254.169.254 -j MEDUSA-METADATA

  # Invoked by CI over IAP with the fully-qualified image ref to roll out.
  - path: /etc/medusa/deploy.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      IMAGE="$${1:?usage: deploy.sh <image-ref>}"
      export HOME=/var/lib/medusa
      export DOCKER_CONFIG=/var/lib/medusa/.docker

      echo "authenticating to Artifact Registry…"
      /etc/medusa/docker-login.sh

      echo "pulling $IMAGE…"
      docker pull "$IMAGE"

      # Only commit the new ref once the pull succeeded, so a failed pull
      # leaves the previous image running rather than a broken pointer.
      echo "$IMAGE" > /var/lib/medusa/current-image

      echo "restarting app…"
      systemctl restart medusa-app.service

      for i in $(seq 1 30); do
        if curl -fsS "http://127.0.0.1:${app_port}/health" >/dev/null 2>&1; then
          echo "✅ app healthy on attempt $i"
          docker image prune -af --filter "until=168h" >/dev/null 2>&1 || true
          exit 0
        fi
        sleep 2
      done

      echo "❌ app failed health check after rollout" >&2
      journalctl -u medusa-app.service --no-pager -n 50 >&2
      exit 1

  - path: /etc/systemd/system/medusa-app.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=medusa-backend application container
      After=docker.service network-online.target
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Restart=always
      RestartSec=5
      Environment=HOME=/var/lib/medusa
      Environment=DOCKER_CONFIG=/var/lib/medusa/.docker
      ExecStartPre=/etc/medusa/block-metadata.sh
      ExecStartPre=/etc/medusa/docker-login.sh
      # On the default bridge, not the host network, so block-metadata.sh can
      # filter what the app reaches. The port is published on the loopback
      # only: cloudflared and the deploy check reach it at 127.0.0.1, and
      # nothing outside the box can.
      ExecStart=/bin/bash -c '/usr/bin/docker run --rm --name medusa-app \
        -p 127.0.0.1:${app_port}:${app_port} \
        -e PORT=${app_port} \
        -e APP_ENV=${environment} \
        --log-driver=gcplogs \
        "$(cat /var/lib/medusa/current-image)"'
      ExecStop=/usr/bin/docker stop medusa-app
      ExecStopPost=-/usr/bin/docker rm -f medusa-app

      [Install]
      WantedBy=multi-user.target

  # `tunnel run --token` is the deployment shape Cloudflare documents for
  # Terraform-managed tunnels; ingress rules come from the Cloudflare side
  # (config_src = "cloudflare"), not from a local config file.
  - path: /etc/systemd/system/cloudflared.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=Cloudflare Tunnel connector
      After=docker.service network-online.target medusa-app.service
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Restart=always
      RestartSec=5
      ExecStartPre=-/usr/bin/docker rm -f cloudflared
      # `set -e` + assignment makes a failed fetch abort the unit. Without it
      # the substitution yields "" and cloudflared crash-loops complaining
      # about a missing tunnel ID, which hides the real cause.
      ExecStart=/bin/bash -c 'set -euo pipefail; \
        TOKEN=$(/etc/medusa/fetch-token.sh); \
        exec /usr/bin/docker run --rm --name cloudflared \
        --network host \
        --log-driver=gcplogs \
        ${cloudflared_image} tunnel --no-autoupdate run \
        --token "$TOKEN"'
      ExecStop=/usr/bin/docker stop cloudflared
      ExecStopPost=-/usr/bin/docker rm -f cloudflared

      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /var/lib/medusa
  # Placeholder so medusa-app.service has a live origin before the first real
  # deploy. CI overwrites this on the first push to STG.
  - echo "${bootstrap_image}" > /var/lib/medusa/current-image
  - /etc/medusa/docker-login.sh
  - systemctl daemon-reload
  - systemctl enable --now medusa-app.service
  - systemctl enable --now cloudflared.service
