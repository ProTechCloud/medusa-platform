<svg xmlns="http://www.w3.org/2000/svg" width="1042" height="516" viewBox="0 0 1042 516" role="img" aria-label="medusa-platform architecture">
<title>medusa-platform architecture</title>
<desc>GitHub Actions signs in through a workload identity pool to hubs in the management project. Each hub can only impersonate one spoke in an environment project, and the spokes are what reach the state bucket, the API VM, the registry, the secrets and the monitoring. The VM reaches out to the registry, the secret and the Cloudflare tunnel; nothing reaches in.</desc>
