<text x="30" y="414" class="lg">Reading the arrows</text>
<text x="30" y="434" class="ln">• GitHub signs in with an OIDC token. No key exists to leak.</text>
<text x="30" y="449" class="ln">• A hub holds one right: becoming its spoke. The spoke holds the access.</text>
<text x="30" y="464" class="ln">• The VM dials out — registry, secret, Cloudflare edge. Nothing dials in.</text>
<text x="30" y="479" class="ln">• The uptime check calls the public hostname, the way a user would.</text>
</svg>
